<text x="250.0" y="70" text-anchor="middle" font-family="'Avenir Next','Montserrat','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#141B34">Families</text>
<text x="250.0" y="94" text-anchor="middle" font-family="'Avenir Next','Montserrat','Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#5A6178">WhatsApp, in their language</text><rect x="440" y="40" width="320" height="72" rx="12" fill="#FFFFFF" stroke="#8FB4EE" stroke-width="2"/>
<text x="600.0" y="70" text-anchor="middle" font-family="'Avenir Next','Montserrat','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#141B34">Doctors</text>
<text x="600.0" y="94" text-anchor="middle" font-family="'Avenir Next','Montserrat','Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#5A6178">history, dictation, signed plan</text><rect x="790" y="40" width="320" height="72" rx="12" fill="#FFFFFF" stroke="#8FB4EE" stroke-width="2"/>
<text x="950.0" y="70" text-anchor="middle" font-family="'Avenir Next','Montserrat','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#141B34">Hospital admin</text>
<text x="950.0" y="94" text-anchor="middle" font-family="'Avenir Next','Montserrat','Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#5A6178">numbers and plain-language questions</text><rect x="90" y="160" width="1020" height="96" rx="14" fill="#141B34"/><text x="600" y="198" text-anchor="middle" font-family="'Avenir Next','Montserrat','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">SUTRA</text><text x="600" y="228" text-anchor="middle" font-family="'Avenir Next','Montserrat','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#C9D3EE">signed pathway · bookings · report filing · rule-based message routing · audit log</text><rect x="90" y="304" width="236" height="72" rx="12" fill="#FFFFFF" stroke="#7FB79A" stroke-width="2"/>
<text x="208.0" y="334" text-anchor="middle" font-family="'Avenir Next','Montserrat','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#141B34">EHR or register</text>
<text x="208.0" y="358" text-anchor="middle" font-family="'Avenir Next','Montserrat','Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#5A6178">Bahmni · state HIS · Excel · paper</text><rect x="352" y="304" width="236" height="72" rx="12" fill="#FFFFFF" stroke="#7FB79A" stroke-width="2"/>
<text x="470.0" y="334" text-anchor="middle" font-family="'Avenir Next','Montserrat','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#141B34">Scheduler</text>
<text x="470.0" y="358" text-anchor="middle" font-family="'Avenir Next','Montserrat','Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#5A6178">slots and confirmed bookings</text><rect x="614" y="304" width="236" height="72" rx="12" fill="#FFFFFF" stroke="#7FB79A" stroke-width="2"/>
<text x="732.0" y="334" text-anchor="middle" font-family="'Avenir Next','Montserrat','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#141B34">Lab and pharmacy</text>
<text x="732.0" y="358" text-anchor="middle" font-family="'Avenir Next','Montserrat','Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#5A6178">reports and prescriptions</text><rect x="876" y="304" width="236" height="72" rx="12" fill="#FFFFFF" stroke="#7FB79A" stroke-width="2"/>
<text x="994.0" y="334" text-anchor="middle" font-family="'Avenir Next','Montserrat','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#141B34">ABDM / ABHA</text>
<text x="994.0" y="358" text-anchor="middle" font-family="'Avenir Next','Montserrat','Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#5A6178">consent and the national record</text>
<text x="600" y="406" text-anchor="middle" font-family="'Avenir Next','Montserrat','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#5A6178">SUTRA replaces nothing. It reads what the hospital already has, books through its scheduler, and never writes the clinical record.</text>
</svg>