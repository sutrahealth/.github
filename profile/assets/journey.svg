<text x="60" y="200" font-family="'Avenir Next','Montserrat','Helvetica Neue',Arial,sans-serif" font-size="14" letter-spacing="3" font-weight="700" fill="#3E8A62">WITH SUTRA</text>
<text x="200" y="200" font-family="'Avenir Next','Montserrat','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#5A6178">The doctor signs one plan. Every step is booked, filed and visible.</text>
