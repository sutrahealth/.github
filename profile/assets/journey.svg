<text x="60" y="52" font-family="'Avenir Next','Montserrat','Helvetica Neue',Arial,sans-serif" font-size="14" letter-spacing="3" font-weight="700" fill="#EE5A45">TODAY</text>
<text x="160" y="52" font-family="'Avenir Next','Montserrat','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#5A6178">The care is continuous. The record of it isn’t: paper, phone calls and systems that don’t talk.</text>
